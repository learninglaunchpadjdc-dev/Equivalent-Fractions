<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Checker | Design System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(20, 28, 42);
            overflow: hidden;
            font-family: 'Stack Sans Notch', ui-sans-serif, system-ui, sans-serif;
        }

        .svg-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .content-overlay {
            position: absolute;
            top: 17.6%;
            left: 2.6%;
            width: 94.8%;
            height: 77.8%;
            z-index: 10;
            display: flex;
            flex-direction: row;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .content-overlay {
                flex-direction: column;
                overflow-y: auto;
                top: 10%;
                height: 85%;
            }
            .sidebar-panel, .main-panel {
                width: 100% !important;
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .fraction-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            color: white;
            font-size: 1.5rem;
            width: 80px;
            padding: 10px;
            transition: all 0.2s;
        }

        .fraction-input:focus {
            outline: none;
            border-color: #EAA834;
            background: rgba(0, 0, 0, 0.6);
        }

        .fraction-divider {
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            width: 80px;
            margin: 8px 0;
        }

        canvas {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            width: 100%;
            height: 100%;
        }

        .font-notch { font-family: 'Stack Sans Notch', sans-serif; }
        .font-mono-custom { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>

    <!-- SVG Template Layer -->
    <div class="svg-background">
        <svg width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" version="1.1" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="1920" height="1080" style="fill:rgb(20,28,42);"/>
            <g transform="matrix(1.791357,0,0,1.791357,-39.566571,-4.934933)">
                <text x="50px" y="77px" style="font-family: 'Stack Sans Notch'; font-weight:700;font-size:30px;fill:white; letter-spacing: 1px;">FRACTION <tspan fill="rgb(234,168,52)">CHECKER</tspan></text>
            </g>
            <g id="CONTENT-FRAME" transform="matrix(1,0,0,0.901191,0,11.773798)">
                <rect x="50" y="190" width="1820" height="840" style="fill:rgb(235,235,235);fill-opacity:0.02; stroke: rgba(255,255,255,0.05); stroke-width: 1px;"/>
            </g>
        </svg>
    </div>

    <!-- Interactive Layer -->
    <div class="content-overlay font-notch">
        <!-- Input Sidebar -->
        <div class="w-1/3 flex flex-col gap-4 sidebar-panel">
            <div class="glass-panel p-6 flex flex-col items-center">
                <h2 class="text-[#EAA834] font-bold uppercase tracking-widest text-[10px] mb-8 opacity-80 self-start">Comparison Terminal</h2>
                
                <div class="flex items-center gap-8">
                    <!-- Fraction A -->
                    <div class="flex flex-col items-center">
                        <input type="number" id="numA" value="1" class="fraction-input">
                        <div class="fraction-divider"></div>
                        <input type="number" id="denA" value="2" class="fraction-input">
                    </div>

                    <div class="text-3xl text-white/20 font-bold">=?</div>

                    <!-- Fraction B -->
                    <div class="flex flex-col items-center">
                        <input type="number" id="numB" value="2" class="fraction-input">
                        <div class="fraction-divider"></div>
                        <input type="number" id="denB" value="4" class="fraction-input">
                    </div>
                </div>

                <div id="resultBox" class="mt-10 w-full py-4 rounded-lg text-center border transition-all duration-500">
                    <span id="resultText" class="uppercase font-bold tracking-widest text-sm">Validating...</span>
                </div>
            </div>

            <div class="glass-panel flex-1 p-6">
                <h2 class="text-white font-bold text-[10px] uppercase tracking-wider opacity-70 mb-4">Activity Log</h2>
                <div id="logs" class="space-y-3 font-mono-custom text-[11px]">
                    <div class="p-2 rounded bg-white/5 border-l-2 border-slate-500 text-slate-400">
                        <span class="opacity-50">SYSTEM:</span> Fraction monitoring active.
                    </div>
                </div>
            </div>
        </div>

        <!-- Visual Analysis Area -->
        <div class="w-2/3 glass-panel relative flex flex-col main-panel">
            <div class="p-3 border-b border-white/10 flex justify-between items-center bg-white/5 rounded-t-xl">
                <div class="text-[9px] text-slate-400 font-mono-custom tracking-tighter">ENGINE: <span class="text-emerald-400">MATH_VIS_V1</span> // RATIO_DETECTOR</div>
                <div id="ratioDisplay" class="text-[#EAA834] font-mono-custom text-[10px] font-bold">RATIO: 0.500</div>
            </div>
            <div id="canvasContainer" class="flex-1 relative m-8">
                <canvas id="visualCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visualCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const inputs = ['numA', 'denA', 'numB', 'denB'];
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const ratioDisplay = document.getElementById('ratioDisplay');
        const logsContainer = document.getElementById('logs');

        function init() {
            window.addEventListener('resize', resize);
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', update);
            });
            resize();
            update();
        }

        function resize() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            update();
        }

        function update() {
            const na = parseInt(document.getElementById('numA').value) || 0;
            const da = parseInt(document.getElementById('denA').value) || 1;
            const nb = parseInt(document.getElementById('numB').value) || 0;
            const db = parseInt(document.getElementById('denB').value) || 1;

            const valA = na / da;
            const valB = nb / db;
            const isEquivalent = Math.abs(valA - valB) < 0.000001 && da !== 0 && db !== 0;

            if (isEquivalent) {
                resultBox.className = "mt-10 w-full py-4 rounded-lg text-center border border-emerald-500/50 bg-emerald-500/10 text-emerald-400";
                resultText.innerText = "EQUIVALENT";
                ratioDisplay.innerText = `RATIO: ${valA.toFixed(3)}`;
            } else {
                resultBox.className = "mt-10 w-full py-4 rounded-lg text-center border border-rose-500/50 bg-rose-500/10 text-rose-400";
                resultText.innerText = "NOT EQUIVALENT";
                ratioDisplay.innerText = `DIFF: ${Math.abs(valA - valB).toFixed(3)}`;
            }

            draw(na, da, nb, db);
        }

        function draw(na, da, nb, db) {
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.width / dpr;
            const h = canvas.height / dpr;
            ctx.clearRect(0, 0, w, h);

            const barHeight = 60;
            const barWidth = w * 0.8;
            const startX = (w - barWidth) / 2;
            const startY = h / 2 - 80;

            drawFractionBar(startX, startY, barWidth, barHeight, na, da, "FRACTION A", "#EAA834");
            drawFractionBar(startX, startY + 120, barWidth, barHeight, nb, db, "FRACTION B", "#4ade80");
        }

        function drawFractionBar(x, y, w, h, num, den, label, color) {
            ctx.fillStyle = "rgba(255,255,255,0.05)";
            ctx.fillRect(x, y, w, h);

            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.font = '10px "JetBrains Mono"';
            ctx.textAlign = 'left';
            ctx.fillText(label, x, y - 10);

            if (den <= 0) return;

            const segmentWidth = w / den;
            for (let i = 0; i < den; i++) {
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                ctx.strokeRect(x + (i * segmentWidth), y, segmentWidth, h);
                
                if (i < num) {
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.6;
                    ctx.fillRect(x + (i * segmentWidth) + 2, y + 2, segmentWidth - 4, h - 4);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        init();
    </script>
</body>
</html>
